name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Scan3D.xcodeproj -target Scan3D \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Scan3D.app Payload/
          zip -qry Scan3D.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Scan3D-ipa
          path: Scan3D.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Scan3D.ipa \
            --title "Scan3D build ${{ github.run_number }}" \
            --notes "Unsigned build. Install with Sideloadly (see README)." \
            --latest
